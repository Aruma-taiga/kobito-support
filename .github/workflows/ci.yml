name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kobito
          POSTGRES_PASSWORD: kobito
          POSTGRES_DB: kobito_support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kobito -d kobito_support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm build:shared
      - name: Build API package
        run: pnpm build:api
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Apply migrations twice
        env:
          DATABASE_URL: postgres://kobito:kobito@127.0.0.1:5432/kobito_support
          NODE_ENV: development
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - name: Seed development defaults
        env:
          DATABASE_URL: postgres://kobito:kobito@127.0.0.1:5432/kobito_support
          NODE_ENV: development
        run: pnpm db:seed
      - name: Test migrations and seeds against PostgreSQL 16
        env:
          DATABASE_URL: postgres://kobito:kobito@127.0.0.1:5432/kobito_support
          NODE_ENV: test
        run: pnpm test:db
