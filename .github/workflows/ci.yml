name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kobito
          POSTGRES_PASSWORD: kobito
          POSTGRES_DB: kobito_support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kobito -d kobito_support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Validate schema against PostgreSQL 16
        env:
          PGPASSWORD: kobito
        run: psql -h 127.0.0.1 -U kobito -d kobito_support -v ON_ERROR_STOP=1 -f docs/schema-v1.sql
